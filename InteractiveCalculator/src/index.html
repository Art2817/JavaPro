<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="calc">
  <input id="d" readonly placeholder="0">
  <button onclick="f('C')">C</button>
  <button onclick="f('B')">⌫</button>
  <button onclick="f('/')">/</button>
  <button onclick="f('*')">*</button>
  <button onclick="f('7')">7</button>
  <button onclick="f('8')">8</button>
  <button onclick="f('9')">9</button>
  <button onclick="f('-')">-</button>
  <button onclick="f('4')">4</button>
  <button onclick="f('5')">5</button>
  <button onclick="f('6')">6</button>
  <button onclick="f('+')">+</button>
  <button onclick="f('1')">1</button>
  <button onclick="f('2')">2</button>
  <button onclick="f('3')">3</button>
  <button onclick="f('=')" style="grid-row: span 2">=</button>
  <button onclick="f('0')" style="grid-column: span 2">0</button>
  <button onclick="f('.')">.</button>
</div>
<script src="script.js"></script>
</body>
</html>
