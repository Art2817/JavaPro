<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid"><a class="navbar-brand" href="#">Registration and Login System</a></div>
</nav>
<div class="container mt-5" style="max-width: 450px;">
    <div class="card shadow-sm">
        <div class="card-header bg-white text-center"><h3>Login</h3></div>
        <div class="card-body">
            <div th:if="${param.error}" class="alert alert-danger">Incorrect email or password.</div>
            <div th:if="${param.logout}" class="alert alert-success">You have successfully logged out</div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username (Email)</label>
                    <input type="text" name="username" class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
                <div class="text-center mt-3"><a th:href="@{/register}">New user? Registration</a></div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
